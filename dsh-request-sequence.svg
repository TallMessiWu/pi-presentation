<svg xmlns="http://www.w3.org/2000/svg" width="972" height="950" viewBox="0 0 972 950" role="img" aria-labelledby="fig-title fig-desc" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="400" fill="#292929"><title id="fig-title">dsh · 从用户输入到 DONE 的三次请求</title><desc id="fig-desc">自上而下阅读。用户先按回车提交任务。本地框架组装三次模型请求，依次收到 read、edit 和 DONE。两次本地文件操作的结果分别进入第二次与第三次请求，最终由终端将 DONE 显示给用户。</desc><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" orient="auto" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#292929" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect width="972" height="950" fill="#fff" /><line x1="79" y1="54" x2="79" y2="933" stroke="#b8b8b8" stroke-width="1" stroke-dasharray="4 5" /><rect x="38.0" y="15" width="82" height="39" rx="2" fill="#fff" stroke="#898989" stroke-width="1" /><text x="79" y="41" text-anchor="middle">用户</text><line x1="310" y1="54" x2="310" y2="933" stroke="#b8b8b8" stroke-width="1" stroke-dasharray="4 5" /><rect x="220.0" y="15" width="180" height="39" rx="2" fill="#fff" stroke="#898989" stroke-width="1" /><text x="310" y="41" text-anchor="middle">dsh headless / 循环</text><line x1="515" y1="54" x2="515" y2="933" stroke="#b8b8b8" stroke-width="1" stroke-dasharray="4 5" /><rect x="456.0" y="15" width="118" height="39" rx="2" fill="#fff" stroke="#898989" stroke-width="1" /><text x="515" y="41" text-anchor="middle">会话日志</text><line x1="690" y1="54" x2="690" y2="933" stroke="#b8b8b8" stroke-width="1" stroke-dasharray="4 5" /><rect x="617.5" y="15" width="145" height="39" rx="2" fill="#fff" stroke="#898989" stroke-width="1" /><text x="690" y="41" text-anchor="middle">本地文件工具</text><line x1="890" y1="54" x2="890" y2="933" stroke="#b8b8b8" stroke-width="1" stroke-dasharray="4 5" /><rect x="835.0" y="15" width="110" height="39" rx="2" fill="#fff" stroke="#898989" stroke-width="1" /><text x="890" y="41" text-anchor="middle">模型服务</text><g data-flow="call"><text x="194.5" y="93" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">按回车：读 config.txt</text><text x="194.5" y="115" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">把 DEBUG 改成 RELEASE</text><line x1="80" x2="308" y1="124" y2="124" stroke="#292929" stroke-width="1.15" marker-end="url(#tip)" /></g><g data-flow="call"><text x="412.5" y="155" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">记录指令、用户任务</text><text x="412.5" y="177" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">和运行环境</text><line x1="311" x2="513" y1="186" y2="186" stroke="#292929" stroke-width="1.15" marker-end="url(#tip)" /></g><g data-flow="return"><text x="412.5" y="217" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">取本步的消息历史</text><line x1="514" x2="312" y1="226" y2="226" stroke="#292929" stroke-width="1.15" marker-end="url(#tip)" stroke-dasharray="4 3" /></g><g data-flow="call"><text x="600.0" y="257" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">第 1 次请求　系统指令、任务与环境提醒、工具清单</text><line x1="311" x2="888" y1="266" y2="266" stroke="#292929" stroke-width="1.15" marker-end="url(#tip)" /></g><g data-flow="return"><text x="600.0" y="297" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">调用 read，读取 config.txt</text><line x1="889" x2="312" y1="306" y2="306" stroke="#292929" stroke-width="1.15" marker-end="url(#tip)" stroke-dasharray="4 3" /></g><g data-flow="call"><text x="412.5" y="337" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">记下助手的 read 调用</text><line x1="311" x2="513" y1="346" y2="346" stroke="#292929" stroke-width="1.15" marker-end="url(#tip)" /></g><g data-flow="call"><text x="500.0" y="377" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">在本地读取文件</text><line x1="311" x2="688" y1="386" y2="386" stroke="#292929" stroke-width="1.15" marker-end="url(#tip)" /></g><g data-flow="call"><text x="602.5" y="417" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">写入 tool/result</text><text x="602.5" y="439" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">两行正文（含 level=info）</text><line x1="689" x2="517" y1="448" y2="448" stroke="#292929" stroke-width="1.15" marker-end="url(#tip)" /></g><g data-flow="return"><text x="412.5" y="487" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">取含读取结果的历史</text><line x1="514" x2="312" y1="496" y2="496" stroke="#292929" stroke-width="1.15" marker-end="url(#tip)" stroke-dasharray="4 3" /></g><g data-flow="call"><text x="600.0" y="527" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">第 2 次请求　原有历史，加上 read 调用与文件内容</text><line x1="311" x2="888" y1="536" y2="536" stroke="#292929" stroke-width="1.15" marker-end="url(#tip)" /></g><g data-flow="return"><text x="600.0" y="567" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">调用 edit，把 DEBUG 改成 RELEASE</text><line x1="889" x2="312" y1="576" y2="576" stroke="#292929" stroke-width="1.15" marker-end="url(#tip)" stroke-dasharray="4 3" /></g><g data-flow="call"><text x="412.5" y="607" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">记下助手的 edit 调用</text><line x1="311" x2="513" y1="616" y2="616" stroke="#292929" stroke-width="1.15" marker-end="url(#tip)" /></g><g data-flow="call"><text x="500.0" y="647" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">在本地修改文件</text><line x1="311" x2="688" y1="656" y2="656" stroke="#292929" stroke-width="1.15" marker-end="url(#tip)" /></g><g data-flow="call"><text x="602.5" y="687" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">写入 tool/result</text><text x="602.5" y="709" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">文件已更新</text><line x1="689" x2="517" y1="718" y2="718" stroke="#292929" stroke-width="1.15" marker-end="url(#tip)" /></g><g data-flow="return"><text x="412.5" y="757" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">取含修改回执的历史</text><line x1="514" x2="312" y1="766" y2="766" stroke="#292929" stroke-width="1.15" marker-end="url(#tip)" stroke-dasharray="4 3" /></g><g data-flow="call"><text x="600.0" y="797" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">第 3 次请求　原有历史，加上 edit 调用与成功回执</text><line x1="311" x2="888" y1="806" y2="806" stroke="#292929" stroke-width="1.15" marker-end="url(#tip)" /></g><g data-flow="return"><text x="600.0" y="837" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">纯文本 DONE</text><line x1="889" x2="312" y1="846" y2="846" stroke="#292929" stroke-width="1.15" marker-end="url(#tip)" stroke-dasharray="4 3" /></g><g data-flow="call"><text x="412.5" y="877" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">记录最终回复</text><line x1="311" x2="513" y1="886" y2="886" stroke="#292929" stroke-width="1.15" marker-end="url(#tip)" /></g><g data-flow="return"><text x="194.5" y="917" text-anchor="middle" paint-order="stroke fill" stroke="#fff" stroke-width="6" stroke-linejoin="round">终端显示 DONE</text><line x1="309" x2="81" y1="926" y2="926" stroke="#292929" stroke-width="1.15" marker-end="url(#tip)" stroke-dasharray="4 3" /></g></svg>